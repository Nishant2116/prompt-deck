<rect x="0" y="0" width="620" height="720" rx="28" fill="#161b22" stroke="#262c36" stroke-width="1.5"/><text x="40" y="72" font-size="26" font-weight="700" letter-spacing="-.5" fill="#e6edf3">Tap to send</text><text x="40" y="104" font-size="16.5" fill="#8b949e">Your saved prompts as chips beside the chat.</text><text x="40" y="128" font-size="16.5" fill="#8b949e">One click sends; while Claude works, it waits its turn.</text><rect x="40" y="200" width="540" height="128" rx="20" fill="url(#hero)"/><text x="64" y="236" font-size="12" font-weight="700" letter-spacing="2.5" fill="#2b1a14" fill-opacity=".7">PROMPT DECK</text><text x="62" y="274" font-size="30" font-weight="700" letter-spacing="-1" fill="#2b1a14">Quick prompts</text><rect x="64" y="288" width="132" height="28" rx="14" fill="#ff6a3d"/><text x="80" y="307" font-size="13" font-weight="700" fill="#fff">+ New prompt</text><rect x="40" y="346" width="258" height="62" rx="16" fill="url(#lit)" stroke="none" stroke-width="1.2"/><text x="56" y="373" font-size="15" font-weight="700" fill="#2b1a14">Continue</text><text x="56" y="393" font-size="12.5" fill="#4a2a1a">Continue with the next step.</text><text x="272" y="373" font-size="15" font-weight="700" fill="#2b1a14">↗</text><rect x="322" y="346" width="258" height="62" rx="16" fill="#1f2630" stroke="#2d3440" stroke-width="1.2"/><text x="338" y="373" font-size="15" font-weight="700" fill="#e6edf3">Summarise progress</text><text x="338" y="393" font-size="12.5" fill="#8b949e">What changed and what is left…</text><text x="554" y="373" font-size="15" font-weight="700" fill="#ff7a45">↗</text><rect x="40" y="426" width="258" height="62" rx="16" fill="#1f2630" stroke="#2d3440" stroke-width="1.2"/><text x="56" y="453" font-size="15" font-weight="700" fill="#e6edf3">Run the tests</text><text x="56" y="473" font-size="12.5" fill="#8b949e">Run the tests and fix any fail…</text><text x="272" y="453" font-size="15" font-weight="700" fill="#ff7a45">↗</text><rect x="322" y="426" width="258" height="62" rx="16" fill="#1f2630" stroke="#2d3440" stroke-width="1.2"/><text x="338" y="453" font-size="15" font-weight="700" fill="#e6edf3">Review my diff</text><text x="338" y="473" font-size="12.5" fill="#8b949e">Review the current diff for bu…</text><text x="554" y="453" font-size="15" font-weight="700" fill="#ff7a45">↗</text><rect x="40" y="506" width="258" height="62" rx="16" fill="#1f2630" stroke="#2d3440" stroke-width="1.2"/><text x="56" y="533" font-size="15" font-weight="700" fill="#e6edf3">Explain simply</text><text x="56" y="553" font-size="12.5" fill="#8b949e">Explain what you just did in…</text><text x="272" y="533" font-size="15" font-weight="700" fill="#ff7a45">↗</text><rect x="322" y="506" width="258" height="62" rx="16" fill="none" stroke="#ff7a45" stroke-opacity=".6" stroke-dasharray="6 6"/><text x="451" y="543" text-anchor="middle" font-size="14" font-weight="600" fill="#8b949e">+ New prompt</text>
<rect x="640" y="0" width="640" height="230" rx="28" fill="#161b22" stroke="#262c36" stroke-width="1.5"/><text x="680" y="72" font-size="26" font-weight="700" letter-spacing="-.5" fill="#e6edf3">Plain Markdown file</text><text x="680" y="104" font-size="16.5" fill="#8b949e">One file, prompts.md. Edit it by</text><text x="680" y="128" font-size="16.5" fill="#8b949e">hand or from the pane; it reloads.</text><rect x="980" y="40" width="270" height="166" rx="16" fill="#0d1117" stroke="#262c36"/><text x="996" y="72" font-size="13" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#ff7a45" font-weight="700">## Continue</text><text x="996" y="98" font-size="13" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#e6edf3" >Continue with the next step.</text><text x="996" y="124" font-size="13" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#e6edf3" ></text><text x="996" y="150" font-size="13" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#ff7a45" font-weight="700">## Run the tests</text><text x="996" y="176" font-size="13" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#e6edf3" >Run the tests and fix any failures.</text>
