<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd25e"/><stop offset=".52" stop-color="#ff8a4c"/><stop offset="1" stop-color="#e0507a"/></linearGradient>
<radialGradient id="glow" cx=".12" cy=".05" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="deep" cx="1" cy="1" r=".6"><stop offset="0" stop-color="#b8306a" stop-opacity=".55"/><stop offset="1" stop-color="#b8306a" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>
<linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#e0507a"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7a1f3a" flood-opacity=".32"/></filter>
<clipPath id="card"><rect width="1280" height="480" rx="36"/></clipPath>
</defs>
<style>text{font-family:'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif}
.f1{animation:fl 7s ease-in-out infinite alternate}.f2{animation:fl 8s ease-in-out -2s infinite alternate}.f3{animation:fl 9s ease-in-out -4s infinite alternate}
.deck{animation:fl 6s ease-in-out infinite alternate}.back{animation:sw 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.tw1{animation:tw 3.4s ease-in-out infinite alternate}.tw2{animation:tw 4.6s ease-in-out -1.5s infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes tw{from{opacity:.25}to{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
<rect width="1280" height="480" fill="url(#bg)"/><rect width="1280" height="480" fill="url(#glow)"/><rect width="1280" height="480" fill="url(#deep)"/>
<circle cx="1180" cy="40" r="170" fill="#fff" fill-opacity=".1"/><circle cx="640" cy="520" r="200" fill="#fff" fill-opacity=".07"/>
</g>
<text x="82" y="142" font-size="17" font-weight="700" letter-spacing="4" fill="#2b1a14" fill-opacity=".7">A CLAUDE CODE PLUGIN</text>
<text x="76" y="240" font-size="98" font-weight="700" letter-spacing="-3" fill="#2b1a14">Prompt Deck</text>
<text x="82" y="298" font-size="27" font-weight="500" fill="#3d2418" fill-opacity=".86">Your saved prompts, one tap from the chat.</text>
<g class="f1"><rect x="80" y="352" width="151" height="48" rx="24" fill="#fff" fill-opacity=".74" stroke="#fff" stroke-width="1.5"/><text x="102" y="383" font-size="18" font-weight="600" fill="#2b1a14">Continue</text><text x="201" y="383" font-size="18" font-weight="700" fill="#e0507a">↗</text></g><g class="f2"><rect x="245" y="352" width="201" height="48" rx="24" fill="#fff" fill-opacity=".74" stroke="#fff" stroke-width="1.5"/><text x="267" y="383" font-size="18" font-weight="600" fill="#2b1a14">Run the tests</text><text x="416" y="383" font-size="18" font-weight="700" fill="#e0507a">↗</text></g><g class="f3"><rect x="460" y="352" width="211" height="48" rx="24" fill="#fff" fill-opacity=".74" stroke="#fff" stroke-width="1.5"/><text x="482" y="383" font-size="18" font-weight="600" fill="#2b1a14">Review my diff</text><text x="641" y="383" font-size="18" font-weight="700" fill="#e0507a">↗</text></g>
<g transform="translate(790 70)"><g class="deck">
 <g class="back"><rect x="40" y="40" width="360" height="270" rx="44" fill="url(#glass)" stroke="#fff" stroke-opacity=".6" stroke-width="3" transform="rotate(-10 220 175)"/></g>
 <rect x="40" y="52" width="360" height="270" rx="44" fill="url(#glass)" stroke="#fff" stroke-opacity=".7" stroke-width="3" transform="rotate(-4 220 187)"/>
 <g filter="url(#sh)">
  <rect x="40" y="66" width="360" height="270" rx="44" fill="#fffaf3"/>
  <rect x="80" y="116" width="160" height="28" rx="14" fill="#2b1a14"/>
  <rect x="80" y="166" width="214" height="20" rx="10" fill="#2b1a14" fill-opacity=".28"/>
  <rect x="80" y="202" width="156" height="20" rx="10" fill="#2b1a14" fill-opacity=".18"/>
  <circle cx="330" cy="272" r="44" fill="url(#arrow)"/>
  <path d="M312 290L348 254M320 254H348V282" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</g></g>
<path class="tw1" transform="translate(1200 110)" d="M0-40L8.5-8.5 40 0 8.5 8.5 0 40-8.5 8.5-40 0-8.5-8.5Z" fill="#fff"/>
<path class="tw2" transform="translate(770 90) scale(.55)" d="M0-40L8.5-8.5 40 0 8.5 8.5 0 40-8.5 8.5-40 0-8.5-8.5Z" fill="#fff"/>
<path class="tw1" transform="translate(1150 420) scale(.45)" d="M0-40L8.5-8.5 40 0 8.5 8.5 0 40-8.5 8.5-40 0-8.5-8.5Z" fill="#fff"/>
</svg>